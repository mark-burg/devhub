<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dev Hub</title>
  <meta name="description" content="Test reports, coverage, benchmarks and developer docs in one place.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/app.css">
  <script>
    // Apply the saved theme before first paint (same key/values as Allure 3 reports).
    try { var t = (localStorage.getItem("theme") || "").replace(/"/g, ""); if (t === "dark" || t === "light") document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <script type="module" src="assets/js/main.js"></script>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Navigation">
      <div class="sb-head">
        <a class="brand" href="#/">
          <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7l8-4 8 4-8 4z"/><path d="M4 12l8 4 8-4"/><path d="M4 17l8 4 8-4"/></svg></span>
          <span class="brand-text"><span class="brand-title" id="brand-title">Dev Hub</span><span class="brand-sub" id="brand-sub"></span></span>
        </a>
      </div>
      <button class="sb-search" id="search-btn" type="button">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <span>Search reports…</span><kbd id="kbd-hint">⌘K</kbd>
      </button>
      <nav class="sb-nav" id="sb-nav"></nav>
      <div class="sb-foot">
        <span id="sb-updated"></span>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>
    <div class="main">
      <header class="topbar">
        <button class="btn btn-ghost btn-icon menu-btn" id="menu-btn" type="button" aria-label="Open navigation">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
        <div class="topbar-actions">
          <button class="btn btn-ghost btn-icon search-top" id="search-btn-top" type="button" aria-label="Search">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
          </button>
          <button class="btn btn-ghost btn-icon" id="theme-btn" type="button" aria-label="Theme"></button>
        </div>
      </header>
      <main class="view" id="view" tabindex="-1"></main>
    </div>
  </div>

  <dialog class="palette" id="palette" aria-label="Search">
    <div class="palette-box">
      <div class="palette-search">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="palette-input" type="text" placeholder="Jump to a project, report, run, commit or page…" autocomplete="off" spellcheck="false" aria-controls="palette-list">
        <kbd>esc</kbd>
      </div>
      <ul class="palette-list" id="palette-list" role="listbox"></ul>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
