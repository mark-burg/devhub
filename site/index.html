<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dev Hub</title>
  <meta name="description" content="Test reports, coverage, benchmarks and developer docs in one place.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>
    // Apply the saved theme before first paint (same key/values as Allure 3 reports).
    try { var t = (localStorage.getItem("theme") || "").replace(/"/g, ""); if (t === "dark" || t === "light") document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <script type="module" src="/src/main.tsx"></script>
</head>
<body>
  <div id="root"></div>
  <noscript>Dev Hub needs JavaScript to show reports.</noscript>
</body>
</html>
